<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="William Price — personal website composition study.">
    <title>William Price</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="composition-body">
    <header class="site-header composition-header">
        <a class="wordmark" href="index.html" aria-label="William Price home">WP</a>
        <nav class="site-nav" aria-label="Primary navigation">
            <a class="active" aria-current="page" href="index.html">Index</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="composition-page" aria-label="Layout composition study">
        <section class="tile-group tile-group-left" aria-label="Tiles 1 through 3">
            <article class="shape-tile tile-tan tile-tall tile-portrait" aria-label="Tile 1, portrait of William Price">
                <span class="tile-number">01</span>
                <img src="assets/william-price-portrait.jpg" alt="Portrait of William Price in field equipment beneath a blue sky">
            </article>
            <article class="shape-tile tile-charcoal tile-document-tile" aria-label="Tile 2">
                <span class="tile-number">02</span>
                <a class="tile-document" href="assets/spherical-coordinate-study.pdf" target="_blank" rel="noopener" aria-label="Open the spherical-coordinate study PDF">
                    <img src="assets/spherical-coordinate-study-tile.png" alt="Handwritten spherical-coordinate diagram and derivation of the volume of a sphere">
                </a>
            </article>
            <article class="shape-tile tile-tan tile-photo" aria-label="Tile 3">
                <span class="tile-number">03</span>
                <div class="photo-grid" aria-label="Photographs from Japan">
                    <img src="assets/japan-mountain.jpeg" alt="Hillside neighborhood and bamboo forest beneath a deep evening sky">
                    <img src="assets/japan-pagoda-street.jpeg" alt="Illuminated Japanese street leading toward a pagoda at dusk">
                    <img src="assets/japan-bamboo.jpeg" alt="Path winding through a tall bamboo grove">
                    <img src="assets/japan-torii.jpeg" alt="Path passing through rows of orange torii gates">
                </div>
            </article>
        </section>

        <section class="tile-group tile-group-right" aria-label="Tiles 4 through 7">
            <article class="shape-tile tile-charcoal tile-document-tile tile-document-contain" aria-label="Tile 4">
                <span class="tile-number">04</span>
                <a class="tile-document" href="assets/rotating-standard-basis-study.pdf" target="_blank" rel="noopener" aria-label="Open the rotating-standard-basis study PDF">
                    <img src="assets/rotating-standard-basis-study-tile.png" alt="Handwritten coordinate axes, standard basis vectors, and three elementary rotation matrices">
                </a>
            </article>
            <article class="shape-tile tile-tan tile-cube" aria-label="Tile 5, rotating cube">
                <span class="tile-number">05</span>
                <div class="cube-stage" aria-hidden="true">
                    <div class="cube-axis cube-axis-x"></div>
                    <div class="cube-axis cube-axis-y"></div>
                    <div class="cube-axis cube-axis-z"></div>
                    <div class="cube-spin">
                        <div class="cube">
                            <span class="cube-face cube-front"></span>
                            <span class="cube-face cube-back"></span>
                            <span class="cube-face cube-right"></span>
                            <span class="cube-face cube-left"></span>
                            <span class="cube-face cube-top"></span>
                            <span class="cube-face cube-bottom"></span>
                        </div>
                    </div>
                </div>
                <p class="visually-hidden">A wireframe cube rotates continuously around three fixed coordinate axes.</p>
            </article>
            <article class="shape-tile tile-charcoal tile-resume" aria-label="Tile 6, résumé download">
                <span class="tile-number">06</span>
                <span class="tile-heading">Resume</span>
                <a class="resume-download" href="assets/william-price-resume.pdf" download="William-Price-Resume.pdf" aria-label="Download William Price's résumé as a PDF">
                    <img src="assets/william-price-resume-preview.png" alt="Preview of William Price's résumé">
                    <span>Download résumé · PDF</span>
                </a>
            </article>
            <article class="shape-tile tile-tan tile-photo tile-seven" aria-label="Tile 7, photographs">
                <span class="tile-number">07</span>
                <div class="photo-grid" aria-label="Photographs of travel and adventure">
                    <img src="assets/tile-seven-patterns.jpg" alt="Rows of colorful patterned Japanese paper">
                    <img src="assets/tile-seven-surfboard.jpg" alt="William Price looking over the edge of a surfboard">
                    <img src="assets/tile-seven-diving.jpg" alt="Two scuba divers beside a coral reef in deep blue water">
                    <img src="assets/tile-seven-torii.jpg" alt="The Itsukushima torii gate reflected in the water">
                </div>
            </article>
        </section>
    </main>
</body>
</html>
